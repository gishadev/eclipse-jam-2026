<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121214">
    <title>Salvage in 60 Seconds</title>
    <meta name="description" content="Salvage in 60 Seconds — a game by gishadev.">

    <!-- Link previews. Drop a 1200x630 PNG at TemplateData/social-preview.png per project. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Salvage in 60 Seconds">
    <meta property="og:description" content="Salvage in 60 Seconds — a game by gishadev.">
    <meta property="og:image" content="TemplateData/social-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Salvage in 60 Seconds">
    <meta name="twitter:description" content="Salvage in 60 Seconds — a game by gishadev.">
    <meta name="twitter:image" content="TemplateData/social-preview.png">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1">Your browser does not support the HTML canvas element.</canvas>
      <button id="unity-fullscreen-button" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen"></button>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">0%</div>
      </div>
      <div id="unity-warning" aria-live="polite"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingText = document.querySelector("#unity-loading-text");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
      }

      function rebuildFullscreenGUI() {
        fullscreenButton.classList.toggle("is-fullscreen", isFullscreen());
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.textContent = msg;
        if (type == 'error') div.className = 'unity-banner-error';
        else if (type == 'warning') div.className = 'unity-banner-warning';
        warningBanner.appendChild(div);
        updateBannerVisibility();
        if (type != 'error') {
          setTimeout(function () {
            if (div.parentNode) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
      }

      function enterFullscreen() {
        var request = container.requestFullscreen || container.webkitRequestFullscreen || container.msRequestFullscreen;
        if (!request) {
          unityShowBanner("Fullscreen is not supported by this browser.", "warning");
          return;
        }
        Promise.resolve(request.call(container)).catch(function () { });
      }

      function exitFullscreen() {
        var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (!exit) return;
        Promise.resolve(exit.call(document)).catch(function () { });
      }

      function toggleFullscreen() {
        if (isFullscreen()) exitFullscreen();
        else enterFullscreen();
      }

      fullscreenButton.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", rebuildFullscreenGUI);
      document.addEventListener("webkitfullscreenchange", rebuildFullscreenGUI);
      document.addEventListener("MSFullscreenChange", rebuildFullscreenGUI);

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/eclipse-jam-2026.loader.js";
      var config = {
        dataUrl: buildUrl + "/eclipse-jam-2026.data",
        frameworkUrl: buildUrl + "/eclipse-jam-2026.framework.js",
        codeUrl: buildUrl + "/eclipse-jam-2026.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "gishadev",
        productName: "Salvage in 60 Seconds",
        productVersion: "0.0.26",
        showBanner: unityShowBanner,
      };

      // Set this to false to size the canvas DOM element and the WebGL render
      // target yourself instead of letting Unity keep them in sync.
      //config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas
        container.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        //config.devicePixelRatio = 1;
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(progress * 100);
          progressBarFull.style.width = percent + "%";
          progressBarEmpty.setAttribute("aria-valuenow", percent);
          loadingText.textContent = percent + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          // Keyboard input goes to the game right away (press-to-start popup); Unity resumes
          // the browser's suspended audio itself on the first click / key press.
          canvas.focus();

          // If you want to warn the player before they close the tab, uncomment:
          //window.addEventListener("beforeunload", (event) => {
          //  event.preventDefault();
          //  event.returnValue = "";
          //});
        }).catch((message) => {
          loadingBar.style.display = "none";
          unityShowBanner(message, "error");
        });
      };
      script.onerror = () => {
        loadingBar.style.display = "none";
        unityShowBanner("Failed to load " + loaderUrl + ". Check that the Build folder was uploaded next to index.html, and that your server sends compressed files (.br / .gz) with the matching Content-Encoding header.", "error");
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
